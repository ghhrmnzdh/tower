<!doctype html>
<html lang="en" dir="ltr">
<head>
<!-- The social card and the social video, 1200×630. The same popover, menu
     bar and director as the hero (app.js, ogScript): every frame is a pure
     function of time, so tools/og.mjs renders any instant exactly.
     ?t=SECONDS draws one instant · ?capture=1 waits for __render(t) ·
     ?lang=fa the Persian edition. -->
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Tower · social card</title>
<link rel="stylesheet" href="app.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;
  background:radial-gradient(900px 520px at 18% 0%,rgb(80 92 140/.22),transparent 62%),radial-gradient(700px 500px at 100% 100%,rgb(200 120 40/.14),transparent 60%),#050506}
.og *{animation-play-state:paused!important}
.og .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(rgb(255 255 255/.7) .5px,transparent .6px);background-size:3px 3px;pointer-events:none}
.copy{position:absolute;top:58px;left:64px;width:540px}
.brand{display:flex;align-items:center;gap:11px;font:600 22px/1 var(--display);letter-spacing:-.01em;color:#f5f5f7}
.brand .rd{width:30px;height:30px;color:#f5f5f7}
.ogh{margin:40px 0 0;font:700 60px/1.02 var(--display);letter-spacing:-.04em;background:linear-gradient(180deg,#fff 30%,rgb(255 255 255/.62));-webkit-background-clip:text;background-clip:text;color:transparent}
.ogh .dim{background:linear-gradient(180deg,rgb(255 255 255/.62),rgb(255 255 255/.36));-webkit-background-clip:text;background-clip:text}
.ogs{margin-top:24px;font:400 19px/1.45 var(--sans);color:rgb(255 255 255/.62);max-width:470px}
.chips{display:flex;gap:9px;margin-top:38px;flex-wrap:wrap}
.chip{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 15px 0 11px;border-radius:999px;background:rgb(255 255 255/.06);box-shadow:inset 0 0 0 .5px rgb(255 255 255/.14),0 10px 30px rgb(0 0 0/.35);font:500 14.5px/1 var(--sans);color:rgb(255 255 255/.9);white-space:nowrap}
.chip .rd{width:22px;height:22px;color:#f5f5f7;flex:none}
.chip .sf{font-size:16px;color:rgb(255 255 255/.7)}
.chip .v{font:600 15px/1 var(--rounded);font-variant-numeric:tabular-nums}
.chip .u{font-size:12px;color:rgb(255 255 255/.5)}
.chip .stk>*{display:flex;align-items:center;gap:6px}
#cS{overflow:hidden}#cS>*{justify-self:start;white-space:nowrap}
.chip .vu{display:inline-flex;align-items:baseline;gap:4px;direction:ltr}
.chip .am{color:var(--orange)}.chip .rdc{color:var(--red)}
.foot{position:absolute;left:64px;bottom:50px;display:flex;gap:14px;align-items:center;font:500 14px/1 var(--sans);color:rgb(255 255 255/.5)}
.foot .pf{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.foot .pf .sf{font-size:15px;color:rgb(255 255 255/.7)}
.foot b{color:rgb(255 255 255/.86);font-weight:600}
.foot i{font-style:normal;opacity:.4}
.panel{position:absolute;left:612px;top:46px;width:640px;height:640px;transform:none}
.panel .stagehost{position:absolute;left:0;top:0;width:582px;height:582px;transform:scale(1.1);transform-origin:0 0}
.panel .mb .mi:nth-child(n+4){display:none}
html[dir=rtl] .copy{left:auto;right:64px;text-align:right}
html[dir=rtl] .foot{left:auto;right:64px}
html[dir=rtl] .panel{left:-52px}
html[dir=rtl] .ogh{font-size:50px;line-height:1.3;letter-spacing:0}
html[dir=rtl] .ogs{font-size:19px;line-height:1.85}
html[dir=rtl] .brand{flex-direction:row}
html[dir=rtl] .chips{direction:rtl}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="grain"></div>
  <div class="copy">
    <div class="brand"><span class="rd" id="brandRd"></span>Tower</div>
    <h1 class="ogh" id="h"></h1>
    <p class="ogs" id="s"></p>
    <div class="chips">
      <span class="chip"><span class="rd" id="chipRd"></span><span class="stk" id="cS"><span></span><span class="am"></span><span class="am"></span></span></span>
      <span class="chip"><span data-sf="globe"></span><span class="stk" id="cI"><span><span class="l"></span><span class="vu"><span class="v" id="vI">11</span><span class="u">ms</span></span></span><span class="rdc"></span></span></span>
      <span class="chip"><span data-sf="rack"></span><span class="l2"></span><span class="vu"><span class="v" id="vA">214</span><span class="u">ms</span></span></span>
    </div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="desk panel" id="panel"><div class="wall"><div class="grain"></div></div><div class="stagehost" id="stage"></div></div>
</div>
<script>
window.TW_OG = true;
const Q = new URLSearchParams(location.search), FA = Q.get('lang') === 'fa';
const COPY = FA ? {
  h: 'یک دوجین ایجنت.<br><span class="dim">هیچ‌چیز از قلم نمی‌افتد.</span>',
  s: 'برج مراقبت Claude Code در نوار منوی شما: هر ایجنت زنده، مصرف واقعی پلن، و Claude محصور در کشور خودتان.',
  st: ['محافظت می‌شود', 'نگه‌داشته · بیرون از کشور', 'نگه‌داشته · بی‌مسیر'], int: ['اینترنت', 'اینترنت قطع است'], api: 'API',
  foot: '<b>رایگان و متن‌باز</b>', os: ['macOS', 'Linux', 'Windows'],
} : {
  h: 'Run a dozen agents.<br><span class="dim">Miss nothing.</span>',
  s: 'A control tower for Claude Code in your menu bar: every agent live, your real plan usage, and Claude fenced to your country.',
  st: ['Protected', 'Held · off-country', 'Held · no path'], int: ['Internet', 'Internet offline'], api: 'API',
  foot: '<b>Free and open source</b>', os: ['macOS', 'Linux', 'Windows'],
};
if (FA) { document.documentElement.lang = 'fa'; document.documentElement.dir = 'rtl'; }
document.getElementById('h').innerHTML = COPY.h;
document.getElementById('s').textContent = COPY.s;
document.getElementById('foot').innerHTML = COPY.foot + [['macos', 0], ['tux', 1], ['windows', 2]].map(([g, i]) => `<i>·</i><span class="pf"><span data-sf="${g}"></span>${COPY.os[i]}</span>`).join('');
[...document.getElementById('cS').children].forEach((e, i) => e.textContent = COPY.st[i]);
document.querySelector('#cI .l').textContent = COPY.int[0];
document.querySelector('#cI .rdc').textContent = COPY.int[1];
document.querySelector('.l2').textContent = COPY.api;
</script>
<script src="app.js"></script>
<script>
(() => {
  const TW = window.TW, $ = id => document.getElementById(id);
  TW.hydrate(document);
  const sc = TW.buildScene($('stage'), { og: true, clock: 'Tue 9:41' });
  const pv = sc.pv.root, W = 582;
  let state = 'clear';
  TW.radar($('brandRd'), () => ({ state: 'clear' }));
  TW.radar($('chipRd'), () => ({ state }));
  const layout = () => {
    const tw = sc.mb.tw; tw.style.position = 'absolute';
    const cx = W / 2 + 6; tw.style.left = (cx - tw.offsetWidth / 2) + 'px';
    pv.style.left = (cx - 180) + 'px'; pv.style.top = '40px'; pv.style.setProperty('--ax', '180px');
    sc.pv.measure();
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  let cw = [];
  window.__T = 12;
  window.__render = t => {
    const f = TW.ogScript(t);
    TW.applyScene(sc, f, t);
    state = f.state;
    const h = Math.max(f.geo, f.net);
    const wS = [1 - h, f.geo, f.net]; TW.stackTo($('cS'), wS);
    $('cS').style.width = wS.reduce((a, w, i) => a + cw[i] * clamp(w), 0).toFixed(2) + 'px';
    TW.stackTo($('cI'), [1 - f.net, f.net]);
    const m = TW.ms(f.step); $('vI').textContent = m.int; $('vA').textContent = m.api;
    TW.drawAll(t);
  };
  document.fonts.ready.then(() => {
    layout();
    cw = [...$('cS').children].map(e => e.offsetWidth);
    const t0 = Q.has('t') ? +Q.get('t') : null;
    window.__render(t0 ?? 0);
    window.__ready = true;
    if (t0 == null && !Q.has('capture')) { const s = performance.now(); const loop = () => { window.__render(((performance.now() - s) / 1000) % 12); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  });
})();
</script>
</body>
</html>
