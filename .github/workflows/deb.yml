# Build the Debian package and prove it installs and runs on every Ubuntu we
# claim: 22.04 through 26.04. It is Architecture: all (Tower on Linux compiles
# nothing), so it is built once and then installed into each release's
# container.
name: deb

on:
  # Release-only. `release.sh` creates the GitHub release (with its notes) from
  # a Mac; publishing it builds the .deb, proves it installs on every Ubuntu we
  # claim, and attaches it. Nothing runs on ordinary pushes or pull requests —
  # the Docker matrix is too heavy to spend on every commit.
  release:
    types: [published]
  # Build + smoke-test on demand (no publishing), e.g. before tagging.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/deb/build.sh
      - name: lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --no-tag-display-limit dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Ubuntu the README claims. Plain `docker run` rather than a
        # `container:` job so the smoke test runs on the release's own Python
        # with nothing from the runner leaking in.
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: install, run, un-route, remove on ${{ matrix.image }}
        run: |
          DEB=$(ls dist/tower_*.deb | head -1)
          docker run --rm -v "$PWD:/pkg" -w /pkg "${{ matrix.image }}" \
            bash packaging/deb/ci-smoke.sh "$DEB"

  # Attach the .deb to the release that triggered this run. The release itself
  # (title, notes, Tower.app.zip) is created by release.sh, so this job never
  # creates one — it only adds its own asset, and re-running it just replaces it.
  attach:
    if: github.event_name == 'release'
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: publish tower_all.deb
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # A version-less asset name so the install line in the README can be
          # a fixed URL under /releases/latest/download — the same reason
          # Tower.app.zip carries no version.
          mv "tower_${VERSION}_all.deb" tower_all.deb
          gh release upload "$TAG" tower_all.deb --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json url -q .url
